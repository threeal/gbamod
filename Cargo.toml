[package]
name = "gbamod"
version = "0.1.0"
authors = ["Alfi Maulana <alfi.maulana.f@gmail.com>"]
categories = ["command-line-utilities", "emulators"]
edition = "2024"
keywords = ["gba", "rom-hacking", "reverse-engineering", "game-modding"]
license = "MIT"
repository = "https://github.com/threeal/gbamod"
rust-version = "1.99"
description = "Emulator-driven toolkit for reverse engineering and patching GBA games"

[dependencies]
clap = "4.6.7"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.0"

[build-dependencies]
cc = "1.11.0"
cmake = "0.1.58"

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
cargo = "warn"
# `png` depends on two `miniz_oxide` versions, directly and through `flate2`.
multiple_crate_versions = { level = "allow", priority = 1 }

[lints.rust]
warnings = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tarpaulin_include)"] }
