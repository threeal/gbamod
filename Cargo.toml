[package]
name = "gbamod"
version = "0.1.0"
authors = ["Alfi Maulana <alfi.maulana.f@gmail.com>"]
categories = ["command-line-utilities", "emulators"]
edition = "2024"
keywords = ["gba", "rom-hacking", "reverse-engineering", "game-modding"]
license = "MIT"
repository = "https://github.com/threeal/gbamod"
rust-version = "1.99"
description = "Emulator-driven toolkit for reverse engineering and patching GBA games"

[dependencies]
clap = "4.6.7"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
cargo = "warn"

[lints.rust]
warnings = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tarpaulin_include)"] }
